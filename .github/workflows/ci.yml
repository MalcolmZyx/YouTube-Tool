name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Database tests must run in CI; a missing database should fail the build, not skip them.
      REQUIRE_DB: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ytstudio
          POSTGRES_PASSWORD: ytstudio_dev
          POSTGRES_DB: ytstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytstudio -d ytstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=apps/api --cov-report=term-missing
      - name: Dependency vulnerability audit
        run: pip-audit -r apps/api/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
