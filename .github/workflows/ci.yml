name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Database tests must run in CI; a missing database should fail the build, not skip them.
      REQUIRE_DB: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ytstudio
          POSTGRES_PASSWORD: ytstudio_dev
          POSTGRES_DB: ytstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytstudio -d ytstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=apps/api --cov-report=term-missing
      - name: Dependency vulnerability audit
        run: pip-audit -r apps/api/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  dbt:
    # Rebuilds the whole pipeline from nothing: schema, fake channels, dbt models and tests, then checks that the SQL
    # marts agree with the Python audit.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ytstudio
          POSTGRES_PASSWORD: ytstudio_dev
          POSTGRES_DB: ytstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytstudio -d ytstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            pipeline/requirements-dbt.txt
      - name: Install the API's dependencies and dbt (separate environments)
        run: |
          pip install -r apps/api/requirements.txt
          python -m venv .dbt-venv
          .dbt-venv/bin/pip install -r pipeline/requirements-dbt.txt
      - name: Create the schema and the fake channels
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python -m db sync-catalog
          python -m synthetic seed
      - name: dbt build (models and tests)
        working-directory: pipeline/dbt
        run: ../../.dbt-venv/bin/dbt build --profiles-dir .
      - name: Marts agree with the Python audit
        run: python pipeline/check_marts_match_audit.py
      - name: Generate the documentation site
        working-directory: pipeline/dbt
        run: ../../.dbt-venv/bin/dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            pipeline/dbt/target/index.html
            pipeline/dbt/target/manifest.json
            pipeline/dbt/target/catalog.json
