# Tool configuration (ruff, pytest, coverage) for the whole repository.

[tool.ruff]
line-length = 120
target-version = "py313"
# Import root of the API, so local modules (config, deps, schemas, ...) sort as first-party.
src = ["apps/api"]
extend-exclude = ["apps/api/venv", "apps/web"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# Generated migrations contain long constraint expressions.
"apps/api/migrations/versions/*.py" = ["E501", "W291"]
# One-line SQL statements read better than wrapped ones in the isolation tests.
"apps/api/tests/test_portal_rls.py" = ["E501"]

[tool.coverage.run]
omit = ["apps/api/tests/*", "apps/api/venv/*", "apps/api/migrations/*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = "-ra"
