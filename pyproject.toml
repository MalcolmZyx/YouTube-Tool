# Tool configuration only for now. Packaging metadata arrives with the Phase 1 restructure.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["apps/api/venv", "apps/web"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# app.py inserts its own directory on sys.path before importing services (removed in Phase 1).
"apps/api/app.py" = ["E402"]

[tool.coverage.run]
omit = ["apps/api/tests/*", "apps/api/venv/*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = "-ra"
